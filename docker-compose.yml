version: "3.9"

services:

  dictionary-service:
    build:
      context: ./dictionary-service
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - "${DICT_LOCAL_PORT}:${DICT_INTERNAL_PORT}"
    environment:
      DICT_INTERNAL_PORT: ${DICT_INTERNAL_PORT}
      PG_PORT: ${PG_INTERNAL_PORT}
      PG_DB_NAME: ${PG_DB_NAME}
      PG_ROOT_USER: ${PG_ROOT_USER}
      PG_ROOT_PASSWORD: ${PG_ROOT_PASSWORD}
      RABBITMQ_PORT: ${RABBITMQ_INTERNAL_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    volumes:
      - .m2:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${DICT_INTERNAL_PORT}/api/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - antifraud-network


  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: broker
    hostname: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_LOCAL_PORT}:${RABBITMQ_INTERNAL_PORT}"
      - "15672:15672"   # RabbitMQ Management
    environment:
      TZ: ${TZ}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - mq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD-SHELL", "rabbitmq-diagnostics -q check_port_connectivity" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - antifraud-network

  postgres:
    image: postgres:17-alpine
    container_name: database
    restart: unless-stopped
    ports:
        - "${PG_LOCAL_PORT}:${PG_INTERNAL_PORT}"
    environment:
        POSTGRES_DB: ${PG_DB_NAME}
        POSTGRES_USER: ${PG_ROOT_USER}
        POSTGRES_PASSWORD: ${PG_ROOT_PASSWORD}
        PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
        - db_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_ROOT_USER} -d ${PG_DB_NAME}" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
        - antifraud-network

volumes:
  mq_data:
  db_data:

networks:
  antifraud-network:
    driver: bridge
