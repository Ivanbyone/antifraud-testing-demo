server:
  port: ${DICT_INTERNAL_PORT}
  servlet:
    context-path: /api

spring:
  application:
    name: dictionary-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://database:${PG_PORT}/${PG_DB_NAME}?reWriteBatchedInserts=true
    username: ${PG_ROOT_USER}
    password: ${PG_ROOT_PASSWORD}

  rabbitmq:
    host: broker
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}

rabbit:
  queues:
    black-queue-to: ${BLACK_QUEUE_TO}


management:
  endpoints:
    web:
      exposure:
        include:
        - health
