server:
  port: ${DICT_INTERNAL_PORT}

spring:
  application:
    name: dictionary-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://database:${PG_PORT}/${PG_DB_NAME}
    username: ${PG_ROOT_USER}
    password: ${PG_ROOT_PASSWORD}

  rabbitmq:
    host: broker
    port: ${RABBITMQ_INTERNAL_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
